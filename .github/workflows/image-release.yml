name: Publish deployment package for a Workbench image
run-name: Release ${{ inputs.component }} ${{ inputs.image_tag }}
on:
  workflow_dispatch:
    inputs:
      component:
        required: true
        type: choice
        options: [workbench-backend, workbench-frontend, workbench-runtime]
      image_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      source_run:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: aos-work-deployment-release
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: bash .github/scripts/publish-image-release.sh
