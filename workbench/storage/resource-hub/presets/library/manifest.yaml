schemaVersion: 1

plugin:
  key: cloud.tyrion.workbench.library
  name: Library
  version: 1.0.0
  providerType: official
  description: >-
    Manage Library assets, boards, files, folders, knowledge synchronization,
    metadata, automation rules, and sharing through the current user's BasilOS
    authorization.
  hasIframe: false

app:
  key: library
  entryPath: /library
  authProviderKey: basilos

variables:
  base: 'https://{{AOS_STUDIO_DOMAIN: {"title":"AOS Studio Domain","description":"The domain name of the AOS Studio environment, including its domain suffix. Enter only the hostname, without https:// or an API path.","placeholder":"studio.example.com"}}}/typekey/api/v1'

auth:
  type: oauth2
  oauth2:
    authorizeUrl: 'https://{{AOS_STUDIO_DOMAIN: {"title":"AOS Studio Domain","description":"The domain name of the AOS Studio environment, including its domain suffix. Enter only the hostname, without https:// or an API path.","placeholder":"studio.example.com"}}}/typekey/api/v1/oauth2/authorize'
    tokenUrl: 'https://{{AOS_STUDIO_DOMAIN: {"title":"AOS Studio Domain","description":"The domain name of the AOS Studio environment, including its domain suffix. Enter only the hostname, without https:// or an API path.","placeholder":"studio.example.com"}}}/typekey/api/v1/oauth2/token'
    refreshUrl: 'https://{{AOS_STUDIO_DOMAIN: {"title":"AOS Studio Domain","description":"The domain name of the AOS Studio environment, including its domain suffix. Enter only the hostname, without https:// or an API path.","placeholder":"studio.example.com"}}}/typekey/api/v1/oauth2/token'
    userInfoUrl: 'https://{{AOS_STUDIO_DOMAIN: {"title":"AOS Studio Domain","description":"The domain name of the AOS Studio environment, including its domain suffix. Enter only the hostname, without https:// or an API path.","placeholder":"studio.example.com"}}}/typekey/api/v1/oauth2/userinfo'
    unbindUrl: 'https://{{AOS_STUDIO_DOMAIN: {"title":"AOS Studio Domain","description":"The domain name of the AOS Studio environment, including its domain suffix. Enter only the hostname, without https:// or an API path.","placeholder":"studio.example.com"}}}/typekey/api/v1/oauth2/bindings/current'
    redirectUri: 'https://{{AOS_WORK_DOMAIN: {"title":"AOS Work Domain","description":"The domain name of the AOS Work (formerly Workbench) environment, including its domain suffix. Enter only the hostname, without https:// or a URL path.","placeholder":"work.example.com"}}}/basilcraw/api/apps/oauth2/callback'
    resultBaseUrl: 'https://{{AOS_WORK_DOMAIN: {"title":"AOS Work Domain","description":"The domain name of the AOS Work (formerly Workbench) environment, including its domain suffix. Enter only the hostname, without https:// or a URL path.","placeholder":"work.example.com"}}}'
    scopes:
      - id
      - username
      - nickname
      - email
    options:
      scopeSeparator: space
      tokenRequestType: form
      clientAuthMethod: basic
      pkce: true
    tokenFields:
      accessToken: access_token
      refreshToken: refresh_token
      tokenType: token_type
      expiresIn: expires_in
    tokenPlacement:
      type: bearer
    account:
      action: getCurrentUser
      idField: id
      nameField: username

actions:
  - key: getCurrentUser
    name: Get current user
    method: GET
    url: '{{base}}/oauth2/userinfo'
    auth: true
    responseDataPath: '$'

  - key: open
    name: Open Library
    method: GET
    url: 'https://{{AOS_WORK_DOMAIN: {"title":"AOS Work Domain","description":"The domain name of the AOS Work (formerly Workbench) environment, including its domain suffix. Enter only the hostname, without https:// or a URL path.","placeholder":"work.example.com"}}}/library'
    auth: false

  - key: deleteBatch
    name: '批量删除资源'
    method: PUT
    url: '{{base}}/assets/deleteBatch'
    auth: true
    input:
      fileItemList:
        type: array
        description: '文件列表'
      folderItemList:
        type: array
        description: '目录列表'
    body:
      fileItemList: '{{input.fileItemList}}'
      folderItemList: '{{input.folderItemList}}'
    responseDataPath: '$'

  - key: moveBatch
    name: '批量移动资源'
    method: PUT
    url: '{{base}}/assets/moveBatch'
    auth: true
    input:
      targetParentId:
        type: string
        description: '目标父文件夹ID，0 表示根目录'
      targetParentVersion:
        type: integer
        description: '目标父级目录版本（乐观锁）'
      fileItemList:
        type: array
        description: '文件移动列表'
      folderItemList:
        type: array
        description: '目录移动列表'
      sharePolicy:
        type: string
        description: '直接分享处理策略'
      shareSnapshotList:
        type: array
        description: '移动预览返回的全量分享快照'
    body:
      targetParentId: '{{input.targetParentId}}'
      targetParentVersion: '{{input.targetParentVersion}}'
      fileItemList: '{{input.fileItemList}}'
      folderItemList: '{{input.folderItemList}}'
      sharePolicy: '{{input.sharePolicy}}'
      shareSnapshotList: '{{input.shareSnapshotList}}'
    responseDataPath: '$'

  - key: previewMove
    name: '预览批量移动对直接分享的影响'
    method: POST
    url: '{{base}}/assets/moveBatch/preview'
    auth: true
    input:
      targetParentId:
        type: string
        description: '目标父文件夹ID，0 表示根目录'
      targetParentVersion:
        type: integer
        description: '目标父级目录版本（乐观锁）'
      fileItemList:
        type: array
        description: '文件移动列表'
      folderItemList:
        type: array
        description: '目录移动列表'
      sharePolicy:
        type: string
        description: '直接分享处理策略'
      shareSnapshotList:
        type: array
        description: '移动预览返回的全量分享快照'
    body:
      targetParentId: '{{input.targetParentId}}'
      targetParentVersion: '{{input.targetParentVersion}}'
      fileItemList: '{{input.fileItemList}}'
      folderItemList: '{{input.folderItemList}}'
      sharePolicy: '{{input.sharePolicy}}'
      shareSnapshotList: '{{input.shareSnapshotList}}'
    responseDataPath: '$'

  - key: search
    name: '资产统一搜索'
    method: POST
    url: '{{base}}/assets/search'
    auth: true
    input:
      enableAI:
        type: boolean
        description: '是否启用 AI 单输入搜索；true 时只能传 naturalLanguage，false 或不传时只能传 keyword'
      naturalLanguage:
        type: string
        description: 'AI 单输入自然语言；enableAI=true 时必填，enableAI=false 或不传时禁止传'
      keyword:
        type: string
        description: '搜索关键词，传入时走四路召回（文件名/描述分词/描述向量/元数据），不传时走纯结构化查询'
      folderIdList:
        type: array
        description: 'LITE模式的目录ID列表'
      tagLogicType:
        type: string
        description: 'LITE模式标签逻辑（AND/OR）'
      tagConditionList:
        type: array
        description: 'LITE模式标签条件列表'
      filterConditionList:
        type: array
        description: '通用过滤条件列表（LITE/PRO通用），支持 CREATED_AT/UPDATED_AT/FILE_SIZE 等数据库字段的 GT/LT/BETWEEN 操作'
      conditionGroupList:
        type: array
        description: 'PRO模式条件组列表'
      fileTypeFilter:
        type: array
        description: '文件类型过滤列表，如 ["IMAGE", "VIDEO", "DOC"]，传 ALL 表示不过滤；传 ["FOLDER"] 表示仅搜索文件夹'
      sortRule:
        type: string
        description: 'sortRule'
      page:
        type: integer
        description: '页码，从1开始；不传默认1'
      size:
        type: integer
        description: '每页数量；不传默认50，最大1000'
    body:
      enableAI: '{{input.enableAI}}'
      naturalLanguage: '{{input.naturalLanguage}}'
      keyword: '{{input.keyword}}'
      folderIdList: '{{input.folderIdList}}'
      tagLogicType: '{{input.tagLogicType}}'
      tagConditionList: '{{input.tagConditionList}}'
      filterConditionList: '{{input.filterConditionList}}'
      conditionGroupList: '{{input.conditionGroupList}}'
      fileTypeFilter: '{{input.fileTypeFilter}}'
      sortRule: '{{input.sortRule}}'
      page: '{{input.page}}'
      size: '{{input.size}}'
    responseDataPath: '$'

  - key: generateStructuredCondition
    name: '资产 AI 搜索条件生成'
    method: POST
    url: '{{base}}/assets/search/ai/structuredCondition'
    auth: true
    input:
      naturalLanguage:
        type: string
        description: '自然语言搜索描述'
        required: true
    body:
      naturalLanguage: '{{input.naturalLanguage}}'
    responseDataPath: '$'

  - key: getFilterFields
    name: '获取搜索过滤字段定义'
    method: GET
    url: '{{base}}/assets/search/filterFields'
    auth: true
    input:
      fileType:
        type: string
        description: '文件类型枚举，如 IMAGE、VIDEO、DOC；不传返回所有类型'
        required: true
    query:
      fileType: '{{input.fileType}}'
    responseDataPath: '$'

  - key: changeModel
    name: '切换模式'
    method: PUT
    url: '{{base}}/assets/system/changeModel'
    auth: true
    input:
      planType:
        type: string
        description: '需要切换的模式'
        required: true
    query:
      planType: '{{input.planType}}'
    responseDataPath: '$'

  - key: getUserHabit
    name: '获取用户习惯'
    method: GET
    url: '{{base}}/assets/system/getUserHabit'
    auth: true
    input:
      habitType:
        type: string
        description: '获取的类型'
        required: true
    query:
      habitType: '{{input.habitType}}'
    responseDataPath: '$'

  - key: getCurrentModel
    name: '获取当前用户模式'
    method: GET
    url: '{{base}}/assets/system/model'
    auth: true
    responseDataPath: '$'

  - key: saveUserHabit
    name: '保存用户习惯'
    method: PUT
    url: '{{base}}/assets/system/saveUserHabit'
    auth: true
    input:
      habitType:
        type: string
        description: '用户习惯类型'
      habitValue:
        type: string
        description: '用户习惯值'
    body:
      habitType: '{{input.habitType}}'
      habitValue: '{{input.habitValue}}'
    responseDataPath: '$'

  - key: saveSearchConfig
    name: '保存资产搜索权重配置'
    method: PUT
    url: '{{base}}/assets/system/searchConfig'
    auth: true
    input:
      fileNameWeight:
        type: number
        description: '文件名召回权重'
      fullTextWeight:
        type: number
        description: '分词召回权重'
      vectorWeight:
        type: number
        description: '向量召回权重'
      metadataWeight:
        type: number
        description: '元数据召回权重'
    body:
      fileNameWeight: '{{input.fileNameWeight}}'
      fullTextWeight: '{{input.fullTextWeight}}'
      vectorWeight: '{{input.vectorWeight}}'
      metadataWeight: '{{input.metadataWeight}}'
    responseDataPath: '$'

  - key: saveBoard
    name: '创建画板'
    method: POST
    url: '{{base}}/assets/board'
    auth: true
    input:
      name:
        type: string
        description: '画板名称'
        required: true
      description:
        type: string
        description: '画板描述'
    body:
      name: '{{input.name}}'
      description: '{{input.description}}'
    responseDataPath: '$'

  - key: getBoard
    name: '查询画板详情'
    method: GET
    url: '{{base}}/assets/board/{{input.boardId}}'
    auth: true
    input:
      boardId:
        type: string
        description: '画板ID'
        required: true
    responseDataPath: '$'

  - key: updateBoard
    name: '更新画板基础信息'
    method: PUT
    url: '{{base}}/assets/board/{{input.boardId}}'
    auth: true
    input:
      boardId:
        type: string
        description: '画板ID'
        required: true
      name:
        type: string
        description: '画板名称'
        required: true
      description:
        type: string
        description: '画板描述'
    body:
      name: '{{input.name}}'
      description: '{{input.description}}'
    responseDataPath: '$'

  - key: deleteBoard
    name: '删除画板'
    method: DELETE
    url: '{{base}}/assets/board/{{input.boardId}}'
    auth: true
    input:
      boardId:
        type: string
        description: '画板ID'
        required: true
    responseDataPath: '$'

  - key: saveElement
    name: '新增画板元素'
    method: POST
    url: '{{base}}/assets/board/{{input.boardId}}/element'
    auth: true
    input:
      boardId:
        type: string
        description: '画板ID'
        required: true
      assetsBoardElementSaveVOs:
        type: array
        description: '画板元素保存参数'
        required: true
    body: '{{input.assetsBoardElementSaveVOs}}'
    responseDataPath: '$'

  - key: deleteElement
    name: '删除画板元素'
    method: DELETE
    url: '{{base}}/assets/board/{{input.boardId}}/element'
    auth: true
    input:
      boardId:
        type: string
        description: '画板ID'
        required: true
      idList:
        type: array
        description: 'id集合'
    body:
      idList: '{{input.idList}}'
    responseDataPath: '$'

  - key: updateElement
    name: '更新画板元素'
    method: PUT
    url: '{{base}}/assets/board/{{input.boardId}}/element/{{input.elementId}}'
    auth: true
    input:
      boardId:
        type: string
        description: '画板ID'
        required: true
      elementId:
        type: string
        description: '元素ID'
        required: true
      content:
        type: string
        description: '备注内容，仅NOTE类型使用'
      elementJson:
        type: object
        description: '单个画板元素的前端编辑JSON'
        required: true
    body:
      content: '{{input.content}}'
      elementJson: '{{input.elementJson}}'
    responseDataPath: '$'

  - key: pageBoard
    name: '分页查询画板'
    method: POST
    url: '{{base}}/assets/board/page'
    auth: true
    input:
      sortField:
        type: string
        description: '排序字段'
      sortDirection:
        type: string
        description: '排序方向'
      page:
        type: integer
        description: '页码'
        required: true
      size:
        type: integer
        description: '每页返回数据记录数, 最大值1000'
        required: true
      name:
        type: string
        description: '画板名称关键词'
    body:
      sortField: '{{input.sortField}}'
      sortDirection: '{{input.sortDirection}}'
      page: '{{input.page}}'
      size: '{{input.size}}'
      name: '{{input.name}}'
    responseDataPath: '$'

  - key: deleteFile
    name: '删除文件'
    method: DELETE
    url: '{{base}}/assets/file'
    auth: true
    input:
      folderId:
        type: string
        description: '文件夹ID'
        required: true
      fileId:
        type: string
        description: '文件Id'
        required: true
    body:
      folderId: '{{input.folderId}}'
      fileId: '{{input.fileId}}'
    responseDataPath: '$'

  - key: getTargetFileInfo
    name: '根据目标类型、目标ID或资产路径获取相关文件信息'
    method: GET
    url: '{{base}}/assets/file/access/file/info'
    auth: true
    input:
      targetType:
        type: string
        description: '目标类型，FILE/FOLDER'
      targetId:
        type: string
        description: '目标ID'
      path:
        type: string
        description: '资产路径，优先级高于目标类型和目标ID'
    query:
      targetType: '{{input.targetType}}'
      targetId: '{{input.targetId}}'
      path: '{{input.path}}'
    responseDataPath: '$'

  - key: addMetadataField
    name: '添加文件元数据字段'
    method: POST
    url: '{{base}}/assets/file/metadata'
    auth: true
    input:
      fileId:
        type: string
        description: '文件ID'
        required: true
      version:
        type: integer
        description: '版本号（乐观锁）'
        required: true
      fieldId:
        type: string
        description: '元数据字段ID'
        required: true
      value:
        type: string
        description: '元数据值'
    body:
      fileId: '{{input.fileId}}'
      version: '{{input.version}}'
      fieldId: '{{input.fieldId}}'
      value: '{{input.value}}'
    responseDataPath: '$'

  - key: updateMetadataField
    name: '修改文件元数据字段'
    method: PUT
    url: '{{base}}/assets/file/metadata'
    auth: true
    input:
      fileId:
        type: string
        description: '文件ID'
        required: true
      version:
        type: integer
        description: '版本号（乐观锁）'
        required: true
      fieldId:
        type: string
        description: '元数据字段ID'
        required: true
      value:
        type: string
        description: '元数据值'
    body:
      fileId: '{{input.fileId}}'
      version: '{{input.version}}'
      fieldId: '{{input.fieldId}}'
      value: '{{input.value}}'
    responseDataPath: '$'

  - key: deleteMetadataField
    name: '删除文件元数据字段'
    method: DELETE
    url: '{{base}}/assets/file/metadata'
    auth: true
    input:
      fileId:
        type: string
        description: '文件ID'
        required: true
      version:
        type: integer
        description: '版本号（乐观锁）'
        required: true
      fieldId:
        type: string
        description: '元数据字段ID'
        required: true
    body:
      fileId: '{{input.fileId}}'
      version: '{{input.version}}'
      fieldId: '{{input.fieldId}}'
    responseDataPath: '$'

  - key: moveFile
    name: '移动文件'
    method: PUT
    url: '{{base}}/assets/file/move'
    auth: true
    input:
      fileId:
        type: string
        description: '文件ID'
        required: true
      targetParentId:
        type: string
        description: '目标父文件夹ID，0 表示根目录'
      version:
        type: integer
        description: '版本号（乐观锁）'
        required: true
    body:
      fileId: '{{input.fileId}}'
      targetParentId: '{{input.targetParentId}}'
      version: '{{input.version}}'
    responseDataPath: '$'

  - key: getFilePreview
    name: '获取文件预览信息'
    method: GET
    url: '{{base}}/assets/file/preview/{{input.fileId}}'
    auth: true
    input:
      fileId:
        type: string
        description: 'fileId'
        required: true
    responseDataPath: '$'

  - key: batchGetFilePreview
    name: '批量获取文件预览信息'
    method: POST
    url: '{{base}}/assets/file/preview/batch'
    auth: true
    input:
      idList:
        type: array
        description: '文件ID列表'
        required: true
    body:
      idList: '{{input.idList}}'
    responseDataPath: '$'

  - key: operatePublicAccess
    name: '批量文件和递归文件夹操作公开访问'
    method: POST
    url: '{{base}}/assets/file/public/access/action'
    auth: true
    input:
      action:
        type: string
        description: '公开访问动作，ENABLE 开启，DISABLE 关闭'
        required: true
      fileIdList:
        type: array
        description: '文件ID列表'
      folderIdList:
        type: array
        description: '文件夹ID列表，包含递归子文件夹'
      targetList:
        type: array
        description: '文件或文件夹目标列表，可按 targetType + targetId 或 path 定位'
    body:
      action: '{{input.action}}'
      fileIdList: '{{input.fileIdList}}'
      folderIdList: '{{input.folderIdList}}'
      targetList: '{{input.targetList}}'
    responseDataPath: '$'

  - key: getRecentFiles
    name: '获取最近访问前20的文件'
    method: GET
    url: '{{base}}/assets/file/recent'
    auth: true
    input:
      top:
        type: integer
        description: '获取最近访问的文件(默认20)'
        required: true
    query:
      top: '{{input.top}}'
    responseDataPath: '$'

  - key: renameFile
    name: '重命名文件'
    method: PUT
    url: '{{base}}/assets/file/rename'
    auth: true
    input:
      fileId:
        type: string
        description: '文件ID'
        required: true
      newName:
        type: string
        description: '新名称'
        required: true
      version:
        type: integer
        description: '版本号（乐观锁）'
        required: true
    body:
      fileId: '{{input.fileId}}'
      newName: '{{input.newName}}'
      version: '{{input.version}}'
    responseDataPath: '$'

  - key: uploadFile
    name: '上传文件到指定目录'
    method: POST
    url: '{{base}}/assets/file/upload'
    auth: true
    input:
      folderId:
        type: string
        description: '目录ID'
        required: true
      folderVersion:
        type: integer
        description: '目录版本（乐观锁）'
        required: true
      file:
        type: string
        description: '上传的文件'
        required: true
    query:
      folderId: '{{input.folderId}}'
      folderVersion: '{{input.folderVersion}}'
      file: '{{input.file}}'
    responseDataPath: '$'

  - key: batchGetUrls
    name: '批量获取资产文件公开URL或预签名URL'
    method: POST
    url: '{{base}}/assets/file/url/batch'
    auth: true
    input:
      assetsFileUrlQueryVOs:
        type: array
        description: '资产文件 URL 查询参数'
        required: true
    body: '{{input.assetsFileUrlQueryVOs}}'
    responseDataPath: '$'

  - key: getAccessibleFolderTree
    name: '查询当前用户有权限的所有目录树'
    method: GET
    url: '{{base}}/assets/access/folder/tree'
    auth: true
    responseDataPath: '$'

  - key: deleteFolder
    name: '删除目录'
    method: DELETE
    url: '{{base}}/assets/folder'
    auth: true
    input:
      folderId:
        type: string
        description: '目录ID'
        required: true
      version:
        type: integer
        description: '当前目录版本（乐观锁）'
        required: true
      parentVersion:
        type: integer
        description: '父级目录版本（乐观锁）'
        required: true
    body:
      folderId: '{{input.folderId}}'
      version: '{{input.version}}'
      parentVersion: '{{input.parentVersion}}'
    responseDataPath: '$'

  - key: getFieldDisplayRuleDetail
    name: '查询文件夹字段展示配置'
    method: GET
    url: '{{base}}/assets/folder/field/display'
    auth: true
    input:
      folderId:
        type: string
        description: '文件夹ID，0表示Home'
        required: true
    query:
      folderId: '{{input.folderId}}'
    responseDataPath: '$'

  - key: saveFieldDisplayRule
    name: '保存文件夹字段展示配置'
    method: PUT
    url: '{{base}}/assets/folder/field/display'
    auth: true
    input:
      folderId:
        type: string
        description: '文件夹ID'
        required: true
      displayMode:
        type: string
        description: '字段展示模式：FOLLOW_PARENT、ALL、CUSTOM'
        required: true
      metadataFieldIdList:
        type: array
        description: '元数据字段ID列表'
    body:
      folderId: '{{input.folderId}}'
      displayMode: '{{input.displayMode}}'
      metadataFieldIdList: '{{input.metadataFieldIdList}}'
    responseDataPath: '$'

