<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{page_title}}</title>
  {{extra_head}}
  <style>
    :root { --app:#f8fafc; --side:#fff; --panel:#fff; --ink:#0f172a; --text:#334155; --muted:#64748b; --dim:#94a3b8; --line:#e2e8f0; --line-soft:#f1f5f9; --soft:#f8fafc; --positive:#16a34a; --positive-soft:#f0fdf4; --warning:#ea580c; --warning-soft:#fff7ed; --info:#2563eb; --radius:8px; --shadow:0 1px 2px rgba(15,23,42,.035); }
    * { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:#cbd5e1 transparent; }
    html { scroll-behavior:smooth; }
    body { min-width:320px; margin:0; background:var(--app); color:var(--ink); font:13px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    ::selection { background:#e2e8f0; color:var(--ink); } *:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
    button,input,select { font:inherit; } button { cursor:pointer; }
    .app { display:flex; min-height:100vh; }
    .side { position:sticky; top:0; display:flex; flex:0 0 248px; flex-direction:column; height:100vh; border-right:1px solid var(--line); background:var(--side); color:var(--text); }
    .brand { display:flex; align-items:center; gap:10px; padding:17px 18px; border-bottom:1px solid var(--line); }
    .mono { display:grid; width:34px; height:34px; place-items:center; border-radius:8px; background:var(--ink); color:#fff; font-size:15px; font-weight:700; }
    .brand-name { color:var(--ink); font-size:14px; font-weight:650; line-height:1.2; }.brand-sub,.nav-label,.metric-label,.table th { color:var(--muted); font-size:9px; font-weight:650; letter-spacing:.1em; text-transform:uppercase; }.brand-sub { color:var(--dim); font-size:9px; letter-spacing:.13em; }
    .nav-group { padding:12px 10px; }.nav-label { padding:14px 10px 6px; color:var(--dim); letter-spacing:.12em; }
    .nav-item { display:flex; width:100%; align-items:center; gap:10px; padding:8px 10px; border:0; border-radius:7px; background:transparent; color:#475569; text-align:left; font-size:12.5px; font-weight:500; transition:background-color .15s,color .15s; }.nav-item:hover { background:var(--soft); color:var(--ink); }.nav-item.is-active { background:var(--line-soft); color:var(--ink); font-weight:600; }.nav-icon { width:16px; color:var(--muted); font-size:15px; text-align:center; }.nav-item:hover .nav-icon,.nav-item.is-active .nav-icon { color:var(--ink); }
    .side-spacer { flex:1; }.user { display:flex; align-items:center; gap:10px; padding:14px 16px; border-top:1px solid var(--line); }.avatar { display:grid; width:30px; height:30px; place-items:center; border-radius:7px; background:var(--line-soft); color:var(--text); font-size:11px; font-weight:700; }.user-name { color:var(--ink); font-size:12px; font-weight:600; }.user-role { color:var(--dim); font-size:10px; }
    .main { min-width:0; flex:1; }.topbar { position:sticky; top:0; z-index:5; display:flex; min-height:58px; align-items:center; gap:16px; padding:8px 24px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.88); backdrop-filter:blur(12px); }.breadcrumb { color:var(--muted); font-size:11px; }.breadcrumb b { color:var(--text); }.page-title { color:var(--ink); font-size:15px; font-weight:650; letter-spacing:-.01em; }.topbar-right { display:flex; align-items:center; gap:10px; margin-left:auto; }.live { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; }.live::before { width:6px; height:6px; border-radius:999px; background:#22c55e; box-shadow:0 0 0 3px #dcfce7; content:""; }
    .content { width:100%; max-width:1480px; padding:20px 24px 48px; }.notice { display:flex; align-items:center; gap:10px; min-height:44px; margin-bottom:16px; padding:10px 12px; border:1px solid #bbf7d0; border-radius:9px; background:var(--positive-soft); color:#166534; font-size:12px; }.notice::before { display:grid; width:24px; height:24px; place-items:center; border-radius:6px; background:#dcfce7; color:var(--positive); content:"+"; font-size:15px; font-weight:700; }
    .toolbar,.filters { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; }.button,.filter { border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); font-size:11.5px; font-weight:600; transition:background-color .15s,border-color .15s; }.button { min-height:34px; padding:7px 13px; box-shadow:var(--shadow); }.button:hover,.filter:hover { border-color:#cbd5e1; background:var(--soft); }.button.primary,.filter.is-active { border-color:var(--ink); background:var(--ink); color:#fff; }.button.primary:hover { background:#1e293b; }
    .project-switcher { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; }.project-card { position:relative; min-width:158px; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; box-shadow:var(--shadow); color:var(--text); cursor:pointer; transition:border-color .15s,background-color .15s; }.project-card:hover { border-color:#cbd5e1; background:#fdfefe; }.project-card.is-active { border-color:var(--ink); box-shadow:0 0 0 1px var(--ink),var(--shadow); }.project-card.is-active::after { position:absolute; top:8px; right:9px; color:var(--positive); content:"selected"; font-size:9px; font-weight:700; }.project-name { color:var(--ink); font-size:12px; font-weight:600; }.project-detail { margin-top:2px; color:var(--muted); font-size:9.5px; }.project-stats { display:flex; gap:12px; margin-top:8px; color:var(--muted); font-size:9px; }.project-stats b { display:block; color:var(--ink); font-size:11.5px; font-variant-numeric:tabular-nums; }
    .filter-bar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:16px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:#fff; box-shadow:var(--shadow); }.filter-label { margin-right:3px; color:var(--muted); font-size:9px; font-weight:650; letter-spacing:.09em; text-transform:uppercase; }.filter.clear { border-color:#fecaca; color:#dc2626; }.metrics { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-bottom:16px; }.metrics.k6 { grid-template-columns:repeat(6,minmax(0,1fr)); }.metrics.k4 { grid-template-columns:repeat(4,minmax(0,1fr)); }.metric,.card { overflow:hidden; border:1px solid var(--line); border-radius:9px; background:var(--panel); box-shadow:var(--shadow); }.metric { padding:13px 14px; }.metric-value { margin-top:6px; color:var(--ink); font-size:21px; font-weight:650; letter-spacing:-.025em; font-variant-numeric:tabular-nums; }.metric-sub { margin-top:2px; color:var(--muted); font-size:10px; }.metric-note { margin-top:5px; padding-top:4px; border-top:1px dashed var(--line-soft); color:var(--muted); font-size:9.5px; font-style:italic; line-height:1.4; }.metric.is-warning .metric-value { color:var(--warning); }
    .dashboard-grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr); gap:14px; align-items:start; }.card-head { display:flex; min-height:48px; align-items:center; justify-content:space-between; gap:12px; padding:12px 15px; border-bottom:1px solid var(--line); }.card-title { margin:0; color:var(--ink); font-size:13px; font-weight:650; letter-spacing:-.005em; }.card-meta { color:var(--muted); font-size:9px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; }.card-body { padding:14px 15px 16px; }
    .table-scroll { max-height:430px; overflow:auto; }.table { width:100%; border-collapse:collapse; font-size:11.5px; }.table th { position:sticky; top:0; padding:9px 10px; border-bottom:1px solid var(--line); background:#fff; text-align:left; font-size:9px; letter-spacing:.06em; }.table td { padding:8px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap; font-variant-numeric:tabular-nums; }.table tbody tr:last-child td { border-bottom:0; }.table tbody tr:hover td { background:var(--soft); }
    .status { display:inline-block; padding:2px 7px; border-radius:999px; font-size:9px; font-weight:650; }.status.positive { background:#dcfce7; color:#166534; }.status.warning { background:#ffedd5; color:#9a3412; }.status.info { background:#dbeafe; color:#1d4ed8; }.status.neutral { background:var(--line-soft); color:#475569; }.mini-bar { display:inline-block; width:76px; height:6px; overflow:hidden; border-radius:999px; background:var(--line-soft); vertical-align:middle; }.mini-bar i { display:block; height:100%; background:#22c55e; }.mini-bar i.warning { background:#f97316; }.coverage { margin-left:5px; color:var(--muted); font-size:10px; }
    .bar-row { display:grid; grid-template-columns:minmax(70px,1fr) minmax(90px,2.2fr) 58px; align-items:center; gap:10px; margin:11px 0; color:var(--text); font-size:11px; }.bar-track { height:15px; overflow:hidden; border-radius:999px; background:var(--line-soft); }.bar-fill { height:100%; border-radius:999px; background:#22c55e; }.bar-fill.warning { background:#f97316; }.bar-fill.info { background:var(--info); }.bar-value { color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }.legend { display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; color:var(--muted); font-size:10px; }.legend span { display:inline-flex; align-items:center; gap:5px; }.legend i { width:8px; height:8px; border-radius:999px; background:#22c55e; }.legend i.warning { background:#f97316; }.legend i.info { background:var(--info); }
    .distribution { display:flex; height:34px; overflow:hidden; border-radius:7px; background:var(--line-soft); }.distribution > span { display:flex; min-width:0; align-items:center; justify-content:center; color:#fff; font-size:9px; font-weight:700; }.distribution .positive { background:#22c55e; }.distribution .warning { background:#f97316; }.distribution .info { background:var(--info); }.distribution .neutral { background:#94a3b8; }.worklist { padding:6px; }.work-row { display:flex; align-items:center; gap:10px; padding:10px 11px; border:1px solid transparent; border-radius:7px; }.work-row + .work-row { margin-top:2px; }.work-row:hover { background:var(--soft); }.work-row.is-warning { background:var(--warning-soft); }.rank { display:grid; width:21px; height:21px; place-items:center; flex:none; border-radius:5px; background:var(--ink); color:#fff; font-size:10px; font-weight:700; }.work-copy { min-width:0; flex:1; }.work-name { color:var(--ink); font-size:12px; font-weight:600; }.work-facts { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }.fact { padding:2px 6px; border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--muted); font-size:9px; }.work-result { width:128px; flex:none; text-align:right; }.work-result .bar-track { height:9px; }.work-result small { color:var(--muted); font-size:10px; font-variant-numeric:tabular-nums; }.content-body { margin-top:14px; }.dashboard-panel[hidden] { display:none; }.dashboard-panel:focus { outline:none; }.content-body > * + * { margin-top:14px; }
    @media (max-width:1100px) { .side { display:none; }.content { padding:16px 18px 40px; }.topbar { padding:8px 18px; }.metrics,.metrics.k6 { grid-template-columns:repeat(3,minmax(0,1fr)); }.dashboard-grid { grid-template-columns:1fr; } }
    @media (max-width:720px) { .content { padding:14px 12px 36px; }.topbar { padding:8px 12px; }.topbar-right .live { display:none; }.metrics,.metrics.k6,.metrics.k4 { grid-template-columns:repeat(2,minmax(0,1fr)); }.dashboard-grid { gap:12px; }.table { min-width:560px; }.work-result { display:none; } }
    @media print { .side,.toolbar,.topbar-right { display:none; }.topbar { position:static; }.content { max-width:none; padding:16px; }.card,.metric { box-shadow:none; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><div class="mono">A</div><div><div class="brand-name">Atelier</div><div class="brand-sub">Operations Suite</div></div></div>
      <nav class="nav-group" aria-label="Dashboard sections"><div class="nav-label">Workspace</div><button class="nav-item is-active" type="button" data-view="overview" aria-controls="panel-overview" aria-current="page"><span class="nav-icon">o</span>Overview</button><button class="nav-item" type="button" data-view="performance" aria-controls="panel-performance"><span class="nav-icon">#</span>Performance</button><button class="nav-item" type="button" data-view="planning" aria-controls="panel-planning"><span class="nav-icon">+</span>Planning</button><button class="nav-item" type="button" data-view="activity" aria-controls="panel-activity"><span class="nav-icon">~</span>Activity</button></nav>
      <div class="side-spacer"></div><div class="user"><div class="avatar">DB</div><div><div class="user-name">Workspace user</div><div class="user-role">Dashboard viewer</div></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="breadcrumb">Workspace / <b>Dashboard</b></div><div class="page-title">{{page_title}}</div></div><div class="topbar-right"><span class="live">Updated {{generated_date}}</span><button class="button" type="button" onclick="window.print()">Print</button></div></header>
      <div class="content"><div class="notice">{{page_subtitle}}</div>{{content_body}}</div>
    </main>
  </div>
  <script>
    const dashboardNavItems = Array.from(document.querySelectorAll('.nav-item[data-view]'));
    const dashboardPanels = new Map(Array.from(document.querySelectorAll('.dashboard-panel[data-panel]')).map((panel) => [panel.dataset.panel, panel]));
    const dashboardTitle = document.querySelector('.page-title');
    function activateDashboardView(view) {
      const panel = dashboardPanels.get(view);
      if (!panel) return false;
      dashboardNavItems.forEach((item) => {
        const active = item.dataset.view === view;
        item.classList.toggle('is-active', active);
        if (active) item.setAttribute('aria-current', 'page');
        else item.removeAttribute('aria-current');
      });
      dashboardPanels.forEach((candidate, name) => { candidate.hidden = name !== view; });
      if (panel.dataset.title && dashboardTitle) dashboardTitle.textContent = panel.dataset.title;
      panel.focus({ preventScroll: true });
      return true;
    }
    dashboardNavItems.forEach((item) => item.addEventListener('click', () => activateDashboardView(item.dataset.view)));
    const dashboardInitialView = dashboardNavItems.find((item) => dashboardPanels.has(item.dataset.view));
    if (dashboardInitialView) activateDashboardView(dashboardInitialView.dataset.view);
    {{extra_scripts}}
  </script>
</body>
</html>
