worker_processes auto;

error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format runtime_json escape=json
        '{"createdAt":"$time_iso8601",'
        '"level":"info",'
        '"service":"workbench-runtime-nginx",'
        '"requestId":"$runtime_request_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"requestTimeSeconds":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstreamStatus":"$upstream_status",'
        '"upstreamResponseTimeSeconds":"$upstream_response_time"}';

    access_log /dev/stdout runtime_json;

    # Docker 用户自定义网络中的内置 DNS。动态解析必须配合 upstream zone。
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    map $http_x_request_id $runtime_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    upstream workbench_runtime_nodes {
        zone workbench_runtime_nodes 64k;
        server workbench-runtime-node:3100 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 3100 default_server;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"service":"workbench-runtime","status":"ok"}\n';
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $runtime_request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # 不加入 non_idempotent，避免自动重放非幂等请求。
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_pass http://workbench_runtime_nodes;
        }
    }
}
