services:
  node-sandbox:
    image: "${NODE_SANDBOX_IMAGE}:${NODE_SANDBOX_VERSION}"
    restart: unless-stopped
    ports:
      - "${NODE_SANDBOX_HOST_PORT}:3000"
    networks:
      - studio

  studio:
    image: "${STUDIO_IMAGE}:${STUDIO_VERSION}"
    restart: unless-stopped
    env_file:
      - .env.middleware
      - .env.studio
    environment:
      NODE_SANDBOX_HOST: http://node-sandbox:3000
    ports:
      - "${STUDIO_API_HOST_PORT}:12001"
    volumes:
      - ./data/studio-logs:/usr/src/app/logs
    depends_on:
      node-sandbox:
        condition: service_started
    networks:
      - studio
      - middleware

  studio-frontend:
    image: "${STUDIO_FRONTEND_IMAGE}:${STUDIO_FRONTEND_VERSION}"
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      SERVER_HOST: http://studio:12001
    ports:
      - "${STUDIO_FRONTEND_HOST_PORT}:80"
    volumes:
      - ./data/studio-logs:/var/log/nginx
    depends_on:
      studio:
        condition: service_started
    networks:
      - studio
      - middleware

networks:
  studio: {}
  middleware:
    external: true
    name: ${BASIL_NETWORK_NAME:-basilos}
